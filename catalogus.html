<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogus | Van der Voet & Co.</title>
  <meta name="description" content="Catalogus van Firma S. van der Voet & Co.: RVS spoeltafels, werkbladen, afzuigkappen, machineonderdelen, koeltechniek en designobjecten op maat.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-pagina="catalogus">
  <div id="site-header"></div>

  <main>
    <section class="pagina-kop">
      <div class="container">
        <h1>Catalogus</h1>
        <p>Alle producten worden op maat gemaakt. Kies een product voor de details en vraag direct een vrijblijvende offerte aan.</p>
      </div>
    </section>

    <section class="sectie">
      <div class="container">
        <div class="catalogus-balk">
          <input id="zoek" class="zoekveld" type="search" placeholder="Zoek in de catalogus, bijv. 'spoeltafel' of 'RVS 316'" aria-label="Zoeken in catalogus">
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter op categorie" style="margin-bottom:20px"></div>
        <div class="resultaat-info" id="resultaat-info" aria-live="polite"></div>
        <div class="producten" id="producten"></div>
      </div>
    </section>

    <section class="sectie" style="padding-top:0">
      <div class="container">
        <div class="cta">
          <div>
            <h2>Staat het er niet bij?</h2>
            <p>Deze catalogus is een selectie. Vrijwel alles in metaal maken wij op maat.</p>
          </div>
          <a class="knop" href="contact.html">Vraag het ons</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/catalogus-data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
